[package]
name = "sohjae_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dependency-free foundations for an embeddable Markdown editor"

[features]
default = ["editor"]
editor = []
renderer = []

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
