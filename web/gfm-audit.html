<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GFM 전체 예제 검사</title><style>body{font:15px/1.6 system-ui;max-width:1100px;margin:24px auto;padding:0 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:12px}summary{cursor:pointer;padding:8px}select{font:inherit;min-height:44px}details{border:1px solid #ddd;margin:8px 0}.pass{color:#28682e}.fail{color:#a13d31}</style><h1>GFM 전체 예제 검사</h1><p id="summary" role="status">불러오는 중…</p><p>편집기 전용 래퍼·빈 커서 자리·선택적 thead/tbody·기본 왼쪽 정렬을 정규화한 HTML 구조 비교입니다. 안전한 HTML/URL 정책은 유지합니다. 전체 적합성 인증을 뜻하지 않습니다.</p><p><a href="https://github.github.com/gfm/">공식 명세</a> · <a href="./collab/rich.html">공유 에디터</a></p><label>결과 <select id="filter"><option value="failed">불일치</option><option value="passed">일치</option><option value="all">전체</option></select></label> <label>분류 <select id="section"><option value="all">전체</option></select></label><div id="cases"></div><script type="module">
const [report,results]=await Promise.all(['gfm-report.json','gfm-results.json'].map(path=>fetch(path).then(response=>response.json())));
document.querySelector('#summary').textContent=`${report.examples}개 검사 · ${report.passed}개 일치 / ${report.failed}개 불일치`;
const sections=document.querySelector('#section');for(const section of Object.keys(report.sections)){const option=document.createElement('option');option.value=section;option.textContent=section;sections.append(option);}
function render(){const filter=document.querySelector('#filter').value,section=sections.value,container=document.querySelector('#cases');container.replaceChildren();for(const item of results.filter(item=>(filter==='all'||item.passed===(filter==='passed'))&&(section==='all'||item.section===section))){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent=`${item.passed?'일치':'불일치'} #${item.example} · ${item.section}`;summary.className=item.passed?'pass':'fail';details.append(summary);details.addEventListener('toggle',()=>{if(!details.open||details.childElementCount>1)return;for(const [label,key]of[['Markdown','markdown'],['명세 HTML','expected_html'],['편집기 HTML','actual_html']]){const title=document.createElement('strong'),pre=document.createElement('pre');title.textContent=label;pre.textContent=item[key];details.append(title,pre);}});container.append(details);}}
document.querySelector('#filter').onchange=render;sections.onchange=render;render();
</script></html>
