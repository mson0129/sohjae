<!doctype html><html lang="ko"><meta charset="utf-8"><title>Toolbar options</title><h1>툴바 옵션 검사</h1><p id="summary">실행 중</p><ol id="results"></ol><div id="fixtures"></div><script type="module">
import {create_editor} from './editor.js';
import {create_replica,new_identity} from './collab/core.js';
let passed=0,failed=0;const assert=(ok,message)=>{if(!ok)throw Error(message);};
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name;passed++;}catch(e){li.textContent='FAIL '+name+': '+e.stack;failed++;}document.querySelector('#results').append(li);}
for(const shared of [false,true])await test('Defaults, full/custom order, runtime changes, palette, validation; collaboration='+shared,async()=>{
 let replica,e;try{if(shared)replica=await create_replica({document_id:new_identity()});const host=document.createElement('div');document.querySelector('#fixtures').append(host);e=await create_editor(host,{markdown:'본문',...(replica?{replica}:{})});
 assert(e.toolbar.hidden,'toolbar must default hidden');const all=[...e.toolbar.children].map(b=>b.dataset.command);
 e.set_options({show_toolbar:true});assert(!e.toolbar.hidden,'show toolbar');assert(e.toolbar.querySelectorAll('button:not([hidden])').length===all.length,'all icons');
 e.set_options({toolbar_items:['save','italic','bold']});assert([...e.toolbar.querySelectorAll('button:not([hidden])')].map(b=>b.dataset.command).join() ==='save,italic,bold','custom order');assert([...e.toolbar.querySelectorAll('button[hidden]')].every(b=>b.tabIndex===-1),'hidden focus');
 e.command_palette();assert(e.dialog.querySelectorAll('option').length===all.length,'palette commands lost');e.dialog.close();
 for(const value of [['unknown'],['bold','bold'],'bold']){let rejected=false;try{e.set_options({toolbar_items:value});}catch{rejected=true;}assert(rejected,'invalid config accepted');}
 e.set_options({toolbar_items:[]});assert(!e.toolbar.querySelector('button:not([hidden])'),'empty list');e.set_options({toolbar_items:null});assert([...e.toolbar.children].map(b=>b.dataset.command).join()===all.join(),'default order restoration');e.set_options({show_toolbar:false});assert(e.toolbar.hidden,'hide again');
 }finally{e?.destroy();replica?.destroy();}
});
document.querySelector('#summary').textContent=passed+' passed / '+failed+' failed';
// Leave a live customized editor for visual verification.
await create_editor(document.querySelector('#fixtures'),{markdown:'# 툴바 설정\n\n원하는 아이콘과 순서를 설정할 수 있습니다.',show_toolbar:true,toolbar_items:['undo','redo','bold','italic','highlight','table','save']});
</script></html>
