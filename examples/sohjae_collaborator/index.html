<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sohjae Markdown 협업 에디터</title><link rel="stylesheet" href="./style.css"><script src="./example.js" defer></script></head><body><main><h1>Markdown 협업 에디터</h1><p id="status" role="status">WASM 로딩 중…</p><p><label>연결 방식 <select id="connection_mode"><option value="same-page">같은 페이지 · 서버 불필요</option><option value="webrtc">WebRTC · STUN/TURN</option></select></label></p><p>같은 페이지 모드는 이 페이지의 두 편집기만 연결합니다. WebRTC 모드는 실제 RTCDataChannel을 검증하며, 다른 기기 연결에는 별도 시그널링 서버가 필요합니다.</p><p><button id="connect" disabled>협업 시작</button></p><details><summary>STUN / TURN 설정</summary><label>ICE 서버 (JSON)<textarea id="ice_servers" rows="3">[{&quot;urls&quot;:&quot;stun:stun.l.google.com:19302&quot;}]</textarea></label><p>기본값은 Google 공개 STUN입니다. 연결이 차단되는 네트워크에서는 사용 중인 TURN 서버의 urls·username·credential을 입력하세요.</p></details><div class="columns"><section><h2>참가자 A · 리치 편집</h2><div id="left"></div></section><section id="right_panel" hidden><h2>참가자 B · 원본 편집</h2><div id="right"></div></section></div></main></body></html>
